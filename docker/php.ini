; 本项目专用 PHP 配置
date.timezone = Asia/Shanghai
default_charset = UTF-8

; 后台导入大 SQL 文件、xml2db 抓取大节目单需要
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300

; img.php 通过 readfile 抓取远程图片
allow_url_fopen = On

; 生产环境不显示报错，避免泄露路径
display_errors = Off
log_errors = On
expose_php = Off
